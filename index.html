<!DOCTYPE html>

  <style>
    /* Responsive Admin CSS */
    .editor-layout { display: flex; height: 100dvh; overflow: hidden; }
    .editor-sidebar { width: 210px; flex-shrink: 0; display: flex; flex-direction: column; background: #060610; border-right: 1px solid rgba(255,255,255,0.06); }
    .editor-sidebar-header { padding: 16px 14px; border-bottom: 1px solid rgba(255,255,255,0.06); }

    .editor-main-inner { max-width: 600px; margin: 0 auto; padding: 44px 40px; }
    .editor-preview { width: 40%; min-width: 350px; background: #000; display: flex; flex-direction: column; }
    
    .dashboard-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 48px; }
    .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }

    .form-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

      .editor-sidebar-footer { flex-direction: row !important; padding: 10px !important; }

      .dashboard-grid { grid-template-columns: 1fr !important; }

    }

      .form-grid-2 { grid-template-columns: 1fr !important; }
    }

function Inp({label,value,onChange,placeholder,type='text',rows,className=''}) {
  const Tag = rows ? 'textarea' : 'input';
  const base = {background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.09)',color:'rgba(255,255,255,0.85)',width:'100%',borderRadius:12,padding:'11px 16px',fontSize:13,outline:'none',fontFamily:'inherit',display:'block'};
  return html`<div class=${className}>
    ${label && html`<div style=${{fontSize:10,textTransform:'uppercase',letterSpacing:4,color:'rgba(255,255,255,0.3)',marginBottom:6}}>${label}</div>`}
    <${Tag} type=${type} value=${value||''} rows=${rows}
      onInput=${e=>onChange(e.target.value)}
      placeholder=${placeholder} style=${base}
      onFocus=${e=>e.target.style.borderColor='rgba(201,169,110,0.45)'}
      onBlur=${e=>e.target.style.borderColor='rgba(255,255,255,0.09)'}
    />
  </div>`;
}

// ── APP ──────────────────────────────────────────────────

async function uploadToStorage(file, retroId, pathPrefix) {
  if(!file) return null;
  const formData = new FormData();
  formData.append('file', file);
  formData.append('retroId', retroId);
  formData.append('path', pathPrefix);
  
  const res = await fetch('/api/upload', { method: 'POST', body: formData, headers: getAuthHeaders() });
  const json = await res.json();
  if (json.url) return json.url;
  throw new Error(json.error || 'Upload failed');
}


// ── AUTHENTICATION UI ────────────────────────────────────
let _supabase = null;
let _session = null;

async function initSupabase() {
  if (_supabase) return _supabase;
  const res = await fetch('/api/config');
  const config = await res.json();
  _supabase = createClient(config.supabaseUrl, config.supabaseAnonKey);
  return _supabase;
}

function getAuthHeaders() {
  return _session ? { 'Authorization': `Bearer ${_session.access_token}` } : {};
}

function AuthScreen({ onLogin }) {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [loading, setLoading] = useState(false);
  const [isRegister, setIsRegister] = useState(false);
  const [error, setError] = useState(null);

  const handleSubmit = async (e) => {
    e.preventDefault();
    setLoading(true);
    setError(null);
    try {
      const sb = await initSupabase();
      let res;
      if (isRegister) {
        res = await sb.auth.signUp({ email, password });
        if (res.error) throw res.error;
        if (res.data.user && !res.data.session) {
           setError("Cadastro realizado! Verifique seu email para confirmar.");
           setLoading(false);
           return;
        }
      } else {
        res = await sb.auth.signInWithPassword({ email, password });
        if (res.error) throw res.error;
      }
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  };

  return html`<div style=${{display:'flex',justifyContent:'center',alignItems:'center',minHeight:'100vh',background:'#08080f',color:'#fff',fontFamily:'Inter, sans-serif'}}>
    <div style=${{width:400,padding:32,background:'rgba(255,255,255,0.02)',border:'1px solid rgba(255,255,255,0.05)',borderRadius:24,boxShadow:'0 24px 80px rgba(0,0,0,0.5)'}}>

        <div style=${{width:56,height:56,background:'linear-gradient(135deg, rgba(201,169,110,0.2) 0%, rgba(201,169,110,0) 100%)',border:'1px solid rgba(201,169,110,0.3)',borderRadius:16,display:'flex',alignItems:'center',justifyContent:'center',color:'#c9a96e',fontSize:24,margin:'0 auto 16px'}}>❤️</div>
        <h1 style=${{fontSize:24,fontWeight:600,margin:0,color:'#fff'}}>Nossa Retrospectiva</h1>
        <p style=${{color:'rgba(255,255,255,0.5)',fontSize:14,marginTop:8}}>Crie e gerencie sua história</p>
      </div>
      
      <form onSubmit=${handleSubmit} style=${{display:'flex',flexDirection:'column',gap:16}}>
        <div>
          <label style=${{display:'block',fontSize:12,color:'rgba(255,255,255,0.6)',marginBottom:6,fontWeight:500}}>Email</label>
          <input type="email" value=${email} onInput=${e=>setEmail(e.target.value)} required style=${{width:'100%',background:'rgba(255,255,255,0.03)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:12,padding:'12px 16px',color:'#fff',fontSize:14,outline:'none'}} />
        </div>
        <div>
          <label style=${{display:'block',fontSize:12,color:'rgba(255,255,255,0.6)',marginBottom:6,fontWeight:500}}>Senha</label>

function App() {
  const [retros, setRetros] = useState([]);
  const [view, setView] = useState('dashboard');
  const [editId, setEditId] = useState(null);
  const [current, setCurrent] = useState(null);
  const [tab, setTab] = useState('basic');
  const [preview, setPreview] = useState(false);
  const [toast, setToast] = useState(null);
  const [session, setSession] = useState(null);
  const [loadingApp, setLoadingApp] = useState(true);

  useEffect(() => {
    initSupabase().then(sb => {
      sb.auth.getSession().then(({ data: { session } }) => {
        _session = session;
        setSession(session);
        setLoadingApp(false);
      });
      sb.auth.onAuthStateChange((_event, session) => {
        _session = session;
        setSession(session);
      });
    });
  }, []);

  useEffect(() => {
    if (session) {
      fetch('/api/retrospectives', { headers: getAuthHeaders() })
        .then(r => r.json())
        .then(data => setRetros(Array.isArray(data) ? data : []))
        .catch(console.error);
    }
  }, [session]);


  const showToast = useCallback((msg,type='success')=>{ setToast({msg,type}); setTimeout(()=>setToast(null),3000); },[]);
  const handleCreate = ()=>{ setCurrent(makeRetro()); setEditId(null); setTab('basic'); setView('editor'); };
  const handleEdit = r=>{ setCurrent({...r}); setEditId(r.id); setTab('basic'); setView('editor'); };

  
  const handleSave = useCallback(async (status='draft')=>{
    if(!current)return;
    const slug = current.slug || generateSlug(`${current.couple.name1} e ${current.couple.name2}`);
    const updated = {...current,status,slug,updatedAt:new Date().toISOString()};
    
    if(editId){ setRetros(p=>p.map(r=>r.id===editId?updated:r)); }
    else { setRetros(p=>[updated,...p]); setEditId(updated.id); }
    setCurrent(updated);
    
    // Always sync with the backend database
    try {
        await fetch('/api/publish', {
            headers: {'Content-Type': 'application/json', ...getAuthHeaders()},
            method: 'POST',
            
            body: JSON.stringify(updated)
        });
    } catch(err) {
        console.error('Failed to sync with backend database:', err);
    }
    
    showToast(status==='published'?'Retrospectiva publicada! 🎉':'Rascunho salvo (Offline)');
  },[current,editId,showToast]);


  const handleDelete    = id=>{ setRetros(p=>p.filter(r=>r.id!==id)); showToast('Excluída.','error'); };
  const handleDuplicate = r =>{ setRetros(p=>[{...r,id:uid(),status:'draft',slug:'',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()},...p]); showToast('Duplicada!'); };

  const update = useCallback((path,value)=>{
    setCurrent(prev=>{
      const next={...prev}; const keys=path.split('.');
      let obj=next;
      for(let i=0;i<keys.length-1;i++){ obj[keys[i]]={...obj[keys[i]]}; obj=obj[keys[i]]; }
      obj[keys[keys.length-1]]=value;
      return next;
    });
  },[]);

  return html`<div style=${{minHeight:'100vh',background:'#08080f',color:'#fff',fontFamily:"'DM Sans',system-ui,sans-serif"}}>
    ${view==='dashboard'
      ? html`<${Dashboard} retros=${retros} onCreate=${handleCreate} onEdit=${handleEdit} onDelete=${handleDelete} onDuplicate=${handleDuplicate} onPreview=${r=>{setCurrent(r);setPreview(true);}}/>`
      : html`<${Editor} retro=${current} tab=${tab} onTabChange=${setTab} onUpdate=${update} onSave=${handleSave} onBack=${()=>setView('dashboard')} onPreview=${()=>setPreview(true)}/>`
    }
    ${preview&&current&&html`<${PreviewModal} retro=${current} onClose=${()=>setPreview(false)}/>`}
    ${toast&&html`<${Toast} message=${toast.msg} type=${toast.type}/>`}
  </div>`;
}

function TimelineTab({retro,onUpdate}) {
  const [exp,setExp]=useState(null);
  const [drag,setDrag]=useState(null);
  const add=()=>{ const e=makeEvent(); onUpdate('timeline',[...retro.timeline,e]); setExp(e.id); };
  const rm=id=>{ onUpdate('timeline',retro.timeline.filter(e=>e.id!==id)); if(exp===id)setExp(null); };
  const upd=(id,k,v)=>onUpdate('timeline',retro.timeline.map(e=>e.id===id?{...e,[k]:v}:e));
  const onDS=i=>setDrag(i);
  const onDO=(e,i)=>{ e.preventDefault(); if(drag===null||drag===i)return; const l=[...retro.timeline]; const[it]=l.splice(drag,1); l.splice(i,0,it); onUpdate('timeline',l); setDrag(i); };
  const uploadPhoto=async (id,file)=>{ if(!file)return; try { const url = await uploadToStorage(file, retro.id, 'timeline'); upd(id,'photo',url); } catch(err) { console.error(err); alert('Upload falhou'); } };
  return html`<div>
    <div style=${{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:32}}>
      <${TabH} title="Linha do Tempo" sub="${retro.timeline.length} evento${retro.timeline.length!==1?'s':''} · Arraste para reordenar"/>
      <button onClick=${add} style=${{display:'flex',alignItems:'center',gap:7,padding:'9px 18px',background:'rgba(201,169,110,0.1)',border:'1px solid rgba(201,169,110,0.25)',borderRadius:12,color:'#c9a96e',fontSize:13,cursor:'pointer',fontFamily:'inherit',flexShrink:0}}>
        <${IC.Plus} s=${14}/> Adicionar
      </button>
    </div>
    ${retro.timeline.length===0
      ? html`<div style=${{textAlign:'center',padding:'56px 0',borderRadius:20,border:'2px dashed rgba(255,255,255,0.07)'}}>
          <div style=${{fontSize:36,marginBottom:12}}>📅</div>
          <div style=${{fontSize:13,color:'rgba(255,255,255,0.25)'}}>Adicione os momentos especiais</div>
        </div>`
      : html`<div style=${{display:'flex',flexDirection:'column',gap:8}}>
          ${retro.timeline.map((ev,i)=>html`<div key=${ev.id}
            draggable=${true} onDragStart=${()=>onDS(i)} onDragOver=${e=>onDO(e,i)} onDragEnd=${()=>setDrag(null)}
            style=${{borderRadius:16,border:'1px solid rgba(255,255,255,0.08)',overflow:'hidden',background:'rgba(255,255,255,0.02)',opacity:drag===i?0.45:1,transition:'opacity 0.15s'}}>
            <div onClick=${()=>setExp(exp===ev.id?null:ev.id)} style=${{display:'flex',alignItems:'center',gap:10,padding:'12px 14px',cursor:'pointer'}}>
              <${IC.Grip} s=${14}/>
              <div style=${{flex:1,minWidth:0}}>
                <div style=${{fontSize:13,color:'#fff',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>${ev.title||'Sem título'}</div>
                ${ev.date&&html`<div style=${{fontSize:11,color:'rgba(255,255,255,0.25)',marginTop:1}}>${ev.date}</div>`}

function GalleryTab({retro,onUpdate}) {
  const ref=useRef(); const [hov,setHov]=useState(null); const [drag,setDrag]=useState(null);
  const [uploadingGallery, setUploadingGallery] = useState(false);
  const upload=async files=>{ setUploadingGallery(true); try { const newItems = []; for(const f of Array.from(files)) { const url = await uploadToStorage(f, retro.id, 'gallery'); newItems.push({id:uid(),url,caption:'',isCover:retro.gallery.length===0 && newItems.length===0}); } onUpdate('gallery', [...retro.gallery, ...newItems]); } catch(err) { console.error(err); alert('Upload falhou'); } finally { setUploadingGallery(false); } };
  const rm=id=>{ const f=retro.gallery.filter(p=>p.id!==id); if(f.length&&!f.some(p=>p.isCover))f[0].isCover=true; onUpdate('gallery',f); };
  const setCover=id=>onUpdate('gallery',retro.gallery.map(p=>({...p,isCover:p.id===id})));
  
  const onDS=i=>setDrag(i);
  const onDO=(e,i)=>{ e.preventDefault(); if(drag===null||drag===i)return; const l=[...retro.gallery]; const[it]=l.splice(drag,1); l.splice(i,0,it); onUpdate('gallery',l); setDrag(i); };

  return html`<div>
    <${TabH} title="Galeria de Fotos" sub="${retro.gallery.length} foto${retro.gallery.length!==1?'s':''}  ·  ⭐ = capa  ·  Arraste para reordenar"/>
    <div style=${{border:'2px dashed rgba(255,255,255,0.08)',borderRadius:20,padding:'40px 32px',textAlign:'center',cursor:'pointer',marginBottom:24,transition:'border-color 0.2s'}}
      onDrop=${e=>{e.preventDefault();upload(e.dataTransfer.files);}}
      onDragOver=${e=>{e.preventDefault();e.currentTarget.style.borderColor='rgba(201,169,110,0.35)';}}
      onDragLeave=${e=>e.currentTarget.style.borderColor='rgba(255,255,255,0.08)'}
      onClick=${()=>ref.current.click()}
      onMouseEnter=${e=>e.currentTarget.style.borderColor='rgba(201,169,110,0.25)'}
      onMouseLeave=${e=>e.currentTarget.style.borderColor='rgba(255,255,255,0.08)'}

      <div style=${{fontSize:13,color:'rgba(255,255,255,0.3)'}}>Arraste ou clique para selecionar</div>
      <div style=${{fontSize:11,color:'rgba(255,255,255,0.15)',marginTop:6}}>JPG, PNG, WEBP</div>
      <input ref=${ref} type="file" accept="image/*" multiple style=${{display:'none'}} onInput=${e=>upload(e.target.files)}/>

    ${retro.gallery.length>0&&html`<div class="form-grid-3">
      ${retro.gallery.map((p,i)=>html`<div key=${p.id}
        draggable=${true} onDragStart=${()=>onDS(i)} onDragOver=${e=>onDO(e,i)} onDragEnd=${()=>setDrag(null)}

        <img src=${p.url} style=${{width:'100%',height:'100%',objectFit:'cover',display:'block'}}/>
        ${hov===p.id&&html`<div style=${{position:'absolute',inset:0,background:'rgba(0,0,0,0.55)',display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
          <button onClick=${()=>setCover(p.id)} style=${{padding:'8px 10px',borderRadius:10,border:'none',cursor:'pointer',background:p.isCover?'#c9a96e':'rgba(255,255,255,0.2)',color:p.isCover?'#000':'#fff'}} title="Definir como Capa"><${IC.Star} s=${13}/></button>

  return html`<div>

    </div>
    ${cartas.length===0
      ? html`<div style=${{textAlign:'center',padding:'56px 0',borderRadius:20,border:'2px dashed rgba(255,255,255,0.07)'}}>
          <div style=${{fontSize:40,marginBottom:12}}>💌</div>
          <div style=${{fontSize:13,color:'rgba(255,255,255,0.3)',marginBottom:6}}>Nenhuma carta ainda</div>
          <div style=${{fontSize:12,color:'rgba(255,255,255,0.18)'}}>Cada carta é revelada uma por uma na experiência</div>
        </div>`
      : html`<div style=${{display:'flex',flexDirection:'column',gap:8}}>
          ${cartas.map((c,i)=>html`<div key=${c.id} 
            draggable=${true} onDragStart=${()=>onDS(i)} onDragOver=${e=>onDO(e,i)} onDragEnd=${()=>setDrag(null)}
            style=${{borderRadius:16,border:'1px solid rgba(255,255,255,0.08)',overflow:'hidden',background:'rgba(255,255,255,0.02)',opacity:drag===i?0.4:1,transition:'opacity 0.2s'}}>
            <div onClick=${()=>setExp(exp===c.id?null:c.id)} style=${{display:'flex',alignItems:'center',gap:10,padding:'12px 14px',cursor:'pointer'}}>
              <${IC.Grip} s=${14} />
              <span style=${{fontFamily:'monospace',fontSize:11,color:'rgba(201,169,110,0.5)',flexShrink:0}}>💌 #${i+1}</span>
              <div style=${{flex:1,fontSize:13,color:c.texto?'#fff':'rgba(255,255,255,0.3)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                ${c.texto?c.texto.slice(0,55)+(c.texto.length>55?'...':''):'Carta vazia — clique para escrever'}
              </div>
              <button onClick=${e=>{e.stopPropagation();rm(c.id);}} style=${{padding:6,borderRadius:8,background:'none',border:'none',color:'rgba(255,255,255,0.15)',cursor:'pointer'}}
                onMouseEnter=${e=>{e.currentTarget.style.background='rgba(239,68,68,0.12)';e.currentTarget.style.color='#f87171';}}
                onMouseLeave=${e=>{e.currentTarget.style.background='none';e.currentTarget.style.color='rgba(255,255,255,0.15)';}}
              ><${IC.X} s=${13}/></button>
              <div style=${{color:'rgba(255,255,255,0.2)',transform:exp===c.id?'rotate(180deg)':'none',transition:'transform 0.2s',display:'flex'}}><${IC.Chev} s=${13}/></div>
            </div>
            ${exp===c.id&&html`<div style=${{padding:'16px 14px 14px',borderTop:'1px solid rgba(255,255,255,0.06)'}}>
              <${Inp} label="Texto da Carta" value=${c.texto} onChange=${v=>upd(c.id,v)}
                placeholder="Escreva aqui sua carta de amor... ❤️" rows=${6}/>
              <div style=${{fontSize:11,color:'rgba(255,255,255,0.2)',marginTop:8,textAlign:'right'}}>
                ${c.texto?c.texto.length+' caracteres':''}
              </div>
            </div>`}
          </div>`)}
        </div>`}
  </div>`;
}


function SectionsTab({retro,onUpdate}) {
  const active=Object.values(retro.sections||{}).filter(Boolean).length;
  return html`<div>
    <${TabH} title="Seções Ativas" sub="${active} de ${SECS.length} seções ativas"/>
    <div style=${{display:'flex',flexDirection:'column',gap:8}}>
      ${SECS.map(({id,label,icon,desc})=>{ const Ico=IC[icon]; return html`
        <div key=${id} style=${{display:'flex',alignItems:'center',gap:14,padding:'14px 16px',borderRadius:14,border:'1px solid rgba(255,255,255,0.07)',background:'rgba(255,255,255,0.02)',transition:'border-color 0.2s'}}
          onMouseEnter=${e=>e.currentTarget.style.borderColor='rgba(255,255,255,0.12)'}
          onMouseLeave=${e=>e.currentTarget.style.borderColor='rgba(255,255,255,0.07)'}>
          <div style=${{width:38,height:38,borderRadius:12,background:retro.sections[id]?'rgba(201,169,110,0.12)':'rgba(255,255,255,0.05)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,color:retro.sections[id]?'#c9a96e':'rgba(255,255,255,0.3)'}}>
            ${Ico&&html`<${Ico} s=${15}/>`}
          </div>
          <div style=${{flex:1}}>
            <div style=${{fontSize:13,fontWeight:500,color:retro.sections[id]?'#fff':'rgba(255,255,255,0.5)'}}>${label}</div>
            <div style=${{fontSize:11,color:'rgba(255,255,255,0.28)',marginTop:2}}>${desc}</div>
          </div>
          <${Sw} checked=${!!retro.sections[id]} onChange=${v=>onUpdate(`sections.${id}`,v)}/>
        </div>`; })}
    </div>
  </div>`;
}

// ── PUBLISH TAB ──────────────────────────────────────────

function PublishTab({retro,onUpdate,onSave}) {
  const url = `${window.location.origin}/r/${retro.slug||'preview'}`;
  
  return html`<div>
    <${TabH} title="Publicação" sub="Gerencie o acesso à sua retrospectiva"/>
    
    <${Sec} title="Status Atual">
      <div style=${{padding:20,borderRadius:16,background:retro.status==='published'?'rgba(16,185,129,0.05)':'rgba(255,255,255,0.02)',border:`1px solid ${retro.status==='published'?'rgba(16,185,129,0.2)':'rgba(255,255,255,0.05)'}`,display:'flex',alignItems:'flex-start',gap:16}}>
        <div style=${{width:40,height:40,borderRadius:20,background:retro.status==='published'?'rgba(16,185,129,0.1)':'rgba(255,255,255,0.05)',display:'flex',alignItems:'center',justifyContent:'center',color:retro.status==='published'?'#34d399':'rgba(255,255,255,0.3)',fontSize:18,flexShrink:0}}>
          ${retro.status==='published'?'🟢':'⚪'}
        </div>
        <div>
          <div style=${{fontSize:16,fontWeight:600,color:retro.status==='published'?'#34d399':'#fff',marginBottom:4}}>
            ${retro.status==='published'?'Sua retrospectiva está online':'Sua retrospectiva não está online (Rascunho)'}
          </div>
          <p style=${{fontSize:13,color:'rgba(255,255,255,0.5)',lineHeight:1.5}}>
            ${retro.status==='published'?'Qualquer pessoa com o link abaixo pode acessar e visualizar esta retrospectiva.':'Ninguém pode acessar esta retrospectiva publicamente enquanto ela estiver como rascunho.'}
          </p>
        </div>
      </div>
    </${Sec}>

    <${Sec} title="Endereço (URL)">
      <div style=${{display:'flex',gap:10}}>
        <div style=${{flex:1,display:'flex',alignItems:'center',background:'rgba(255,255,255,0.03)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:12,padding:'0 16px',color:'rgba(255,255,255,0.5)',fontSize:13}}>
          ${window.location.origin}/r/ <input value=${retro.slug} onChange=${e=>onUpdate('slug', e.target.value)} placeholder="nosso-nome" style=${{background:'transparent',border:'none',color:'#fff',padding:'12px 4px',outline:'none',flex:1,fontFamily:'inherit'}}/>
        </div>
      </div>
      <p style=${{fontSize:11,color:'rgba(255,255,255,0.3)',marginTop:8}}>* O link deve conter apenas letras, números e hífens. Letras minúsculas são recomendadas.</p>
    </${Sec}>

    <${Sec} title="Ações">
      ${retro.status==='published'?html`
        <div style=${{display:'flex',flexDirection:'column',gap:12}}>
          <div style=${{display:'flex',gap:12}}>
             <button onClick=${()=>{navigator.clipboard.writeText(url);}} style=${{flex:1,padding:'12px',background:'rgba(255,255,255,0.05)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:12,color:'#fff',cursor:'pointer',fontFamily:'inherit'}}>Copiar Link</button>
             <button onClick=${()=>window.open(url,'_blank')} style=${{flex:1,padding:'12px',background:'rgba(201,169,110,0.1)',border:'1px solid rgba(201,169,110,0.2)',borderRadius:12,color:'#c9a96e',cursor:'pointer',fontFamily:'inherit'}}>Visualizar Agora</button>
          </div>
          
          <div style=${{padding:16,border:'1px solid rgba(239,68,68,0.2)',background:'rgba(239,68,68,0.05)',borderRadius:12,marginTop:20}}>
            <h4 style=${{color:'#f87171',fontSize:14,marginBottom:6}}>Despublicar Retrospectiva</h4>
            <p style=${{fontSize:12,color:'rgba(255,255,255,0.5)',marginBottom:12}}>Tem certeza? A retrospectiva ficará offline. Seus dados não serão apagados e você poderá publicá-la novamente.</p>
            <button onClick=${()=>onSave('draft')} style=${{padding:'8px 16px',background:'rgba(239,68,68,0.1)',border:'1px solid rgba(239,68,68,0.3)',borderRadius:8,color:'#f87171',fontSize:12,cursor:'pointer'}}>Sim, despublicar agora</button>
          </div>
        </div>
      `:html`
        <div style=${{padding:20,border:'1px solid rgba(201,169,110,0.3)',background:'rgba(201,169,110,0.05)',borderRadius:16,textAlign:'center'}}>
          <h3 style=${{color:'#c9a96e',fontSize:18,marginBottom:8}}>Pronto para compartilhar?</h3>
          <p style=${{fontSize:13,color:'rgba(255,255,255,0.6)',marginBottom:20}}>Depois de publicar, qualquer pessoa com o link poderá visualizar sua retrospectiva.</p>
          <button onClick=${()=>onSave('published')} style=${{padding:'14px 32px',background:'#c9a96e',border:'none',borderRadius:12,color:'#000',fontSize:14,fontWeight:600,cursor:'pointer',fontFamily:'inherit',boxShadow:'0 4px 20px rgba(201,169,110,0.3)'}}>Publicar Retrospectiva ❤️</button>
        </div>
      `}
    </${Sec}>
  </div>`;
}


// ── PREVIEW MODAL ────────────────────────────────────────
function PreviewModal({retro,onClose}) {
  const [device,setDevice]=useState('mobile');
  const couple=[retro.couple.name1,retro.couple.name2].filter(Boolean).join(' & ')||'Nosso Casal';
  return html`<div style=${{position:'fixed',inset:0,zIndex:100,display:'flex',alignItems:'center',justifyContent:'center',background:'rgba(0,0,0,0.88)',backdropFilter:'blur(16px)'}}>
    <div style=${{background:'#0a0a12',border:'1px solid rgba(255,255,255,0.09)',borderRadius:28,overflow:'hidden',width:'92vw',maxWidth:960,maxHeight:'90vh',display:'flex',flexDirection:'column',boxShadow:'0 40px 100px rgba(0,0,0,0.7)'}}>
      <div style=${{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 22px',borderBottom:'1px solid rgba(255,255,255,0.06)'}}>
        <span style=${{fontSize:13,color:'rgba(255,255,255,0.45)'}}>Prévia — ${couple}</span>
        <div style=${{display:'flex',alignItems:'center',gap:10}}>
          <div style=${{display:'flex',background:'rgba(255,255,255,0.05)',borderRadius:12,padding:4,gap:4}}>
            ${[{id:'mobile',Ico:IC.Phone},{id:'desktop',Ico:IC.Monitor}].map(({id,Ico})=>html`
              <button key=${id} onClick=${()=>setDevice(id)} style=${{padding:'7px 10px',borderRadius:9,border:'none',background:device===id?'rgba(255,255,255,0.1)':'transparent',color:device===id?'#fff':'rgba(255,255,255,0.3)',cursor:'pointer'}}>
                <${Ico} s=${15}/>
              </button>`)}
          </div>
          <button onClick=${onClose} style=${{padding:'8px 10px',background:'rgba(255,255,255,0.05)',border:'none',borderRadius:10,color:'rgba(255,255,255,0.4)',cursor:'pointer'}}><${IC.X} s=${15}/></button>
        </div>
      </div>
      <div style=${{flex:1,overflow:'auto',background:'#05050a',display:'flex',alignItems:'center',justifyContent:'center',padding:40}}>
        ${device==='mobile'
          ? html`<div style=${{position:'relative',width:375,height:640,flexShrink:0}}>
              <div style=${{position:'absolute',inset:0,border:'8px solid #2a2a3a',borderRadius:48,overflow:'hidden',boxShadow:'0 24px 60px rgba(0,0,0,0.8)'}}>
                <div style=${{position:'absolute',top:0,left:'50%',transform:'translateX(-50%)',width:100,height:24,background:'#2a2a3a',borderRadius:'0 0 16px 16px',zIndex:10}}/>
                <div style=${{height:'100%',overflowY:'auto'}}><${RetroPreview} retro=${retro} compact=${true}/></div>
              </div>
            </div>`
          : html`<div style=${{width:'100%',maxWidth:800,borderRadius:16,border:'1px solid rgba(255,255,255,0.08)',overflow:'hidden',height:520}}>
              <div style=${{height:'100%',overflowY:'auto'}}><${RetroPreview} retro=${retro}/></div>
            </div>`}
      </div>
    </div>
  </div>`;
}

function RetroPreview({retro,compact}) {
  const gold=retro.theme?.primaryColor||'#c9a96e';
  const rose=retro.theme?.secondaryColor||'#e8a0a0';
  const bg=retro.theme?.bgColor||'#0a0a0f';
  const serif=retro.theme?.font!=='inter'?"'Cormorant Garamond',Georgia,serif":'system-ui,sans-serif';
  const couple=[retro.couple.name1,retro.couple.name2].filter(Boolean).join(' & ')||'Nosso Casal';
  const fd=iso=>{ if(!iso)return''; try{return new Date(iso).toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'});}catch{return iso;} };
  return html`<div style=${{background:bg,fontFamily:serif,color:'#fff',minHeight:'100%'}}>
    <div style=${{minHeight:compact?380:480,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:compact?'48px 24px':'64px 40px',textAlign:'center',background:`linear-gradient(145deg,${bg},#1a0a1a)`}}>
      <div style=${{fontSize:9,letterSpacing:10,color:gold,opacity:0.6,marginBottom:20}}>✦ ✦ ✦</div>
      <h1 style=${{fontSize:compact?26:38,fontWeight:300,lineHeight:1.2,color:'#fff',margin:'0 0 10px'}}>${retro.content.title||'Nosso Primeiro Ano'}</h1>
      <div style=${{fontSize:compact?24:32,color:rose,margin:'0 0 14px'}}>❤</div>
      ${retro.content.subtitle&&html`<p style=${{fontSize:compact?12:14,fontStyle:'italic',color:'rgba(255,255,255,0.45)',maxWidth:280,lineHeight:1.6,margin:'0 0 14px'}}>${retro.content.subtitle}</p>`}
      ${retro.couple.startDate&&html`<div style=${{fontSize:10,letterSpacing:5,color:gold,textTransform:'uppercase',marginBottom:24}}>${fd(retro.couple.startDate)}</div>`}
      <div style=${{padding:'10px 28px',border:`1px solid ${gold}`,borderRadius:50,fontSize:11,letterSpacing:4,textTransform:'uppercase',color:gold}}>Começar</div>
    </div>
    ${retro.content.intro&&html`<div style=${{padding:compact?'28px 22px':'40px 36px',textAlign:'center',borderTop:'1px solid rgba(255,255,255,0.05)'}}>
      <p style=${{fontStyle:'italic',fontSize:compact?14:17,lineHeight:1.65,color:'rgba(255,255,255,0.65)',maxWidth:380,margin:'0 auto 12px'}}>${retro.content.intro}</p>
      <div style=${{fontSize:12,color:gold}}>${couple}</div>
    </div>`}
    ${retro.sections?.timeline&&retro.timeline.length>0&&html`<div style=${{padding:compact?'22px 18px':'32px 28px',borderTop:'1px solid rgba(255,255,255,0.05)'}}>
      <div style=${{textAlign:'center',fontSize:9,letterSpacing:6,textTransform:'uppercase',color:'rgba(255,255,255,0.25)',marginBottom:20}}>Nossa História</div>
      ${retro.timeline.slice(0,compact?2:3).map(ev=>html`<div key=${ev.id} style=${{marginBottom:12,border:'1px solid rgba(255,255,255,0.06)',borderRadius:14,padding:compact?'12px 14px':'16px',background:'rgba(255,255,255,0.02)'}}>
        ${ev.date&&html`<div style=${{fontSize:9,color:gold,letterSpacing:3,textTransform:'uppercase',marginBottom:4}}>${ev.date}</div>`}
        <div style=${{fontSize:compact?13:15,color:'#fff',marginBottom:4}}>${ev.title}</div>
        ${ev.description&&html`<div style=${{fontSize:12,color:'rgba(255,255,255,0.4)',lineHeight:1.5}}>${ev.description.slice(0,80)}${ev.description.length>80?'...':''}</div>`}
        ${ev.photo&&html`<img src=${ev.photo} style=${{width:'100%',borderRadius:10,marginTop:10,height:compact?80:100,objectFit:'cover'}}/>`}
      </div>`)}
      ${retro.timeline.length>(compact?2:3)&&html`<div style=${{textAlign:'center',fontSize:11,color:'rgba(255,255,255,0.18)'}}>+${retro.timeline.length-(compact?2:3)} mais eventos</div>`}
    </div>`}
    ${retro.content.finalMessage&&html`<div style=${{padding:compact?'28px 22px':'40px 36px',textAlign:'center',borderTop:'1px solid rgba(255,255,255,0.05)',background:`linear-gradient(145deg,${bg},#1a0a2a)`}}>
      <div style=${{fontSize:22,color:rose,marginBottom:14}}>❤</div>
      <p style=${{fontStyle:'italic',fontSize:compact?14:17,color:'rgba(255,255,255,0.65)',lineHeight:1.6,maxWidth:340,margin:'0 auto 12px'}}>${retro.content.finalMessage}</p>
      <div style=${{fontSize:10,letterSpacing:4,color:'rgba(255,255,255,0.25)'}}>— ${retro.couple.name1}</div>
    </div>`}
  </div>`;
}

// ── RENDER ───────────────────────────────────────────────
render(html`<${App}/>`, document.getElementById('app'));
</script>
</body>
</html>
